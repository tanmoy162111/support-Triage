# Local dev Postgres 18 + pgvector for Support Triage.
# Start: docker compose --env-file .env.local up -d db
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: support-triage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: support_triage
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - support_triage_pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d support_triage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  support_triage_pgdata:
